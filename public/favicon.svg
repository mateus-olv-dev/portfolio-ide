<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A3D"/>
      <stop offset="100%" stop-color="#E85D04"/>
    </linearGradient>
    <linearGradient id="mGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3E6"/>
      <stop offset="100%" stop-color="#FFD8AE"/>
    </linearGradient>
    <linearGradient id="shadeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB067"/>
      <stop offset="100%" stop-color="#FF7A1A"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background, similar proportions to modern IDE app icons -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)"/>

  <!-- subtle inner border highlight -->
  <rect x="16.5" y="16.5" width="479" height="479" rx="107.5" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>

  <!-- Stylized angular M, built from faceted polygons like a folded ribbon -->
  <g>
    <!-- left leg -->
    <polygon points="120,392 120,120 178,120 178,392" fill="url(#mGrad)"/>
    <!-- right leg -->
    <polygon points="334,392 334,120 392,120 392,392" fill="url(#mGrad)"/>
    <!-- left diagonal stroke -->
    <polygon points="178,120 236,120 256,168 198,168" fill="#FFFFFF"/>
    <polygon points="198,168 256,168 256,392 198,392" fill="url(#shadeGrad)"/>
    <!-- right diagonal stroke -->
    <polygon points="276,120 334,120 314,168 256,168" fill="#FFFFFF"/>
    <polygon points="256,168 314,168 314,392 256,392" fill="url(#shadeGrad)" opacity="0.85"/>
    <!-- center peak accent -->
    <polygon points="236,120 276,120 256,168" fill="#FFFFFF"/>
  </g>
</svg>
